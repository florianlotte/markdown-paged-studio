appId: dev.florianlotte.markdown-paged-studio
productName: Markdown Paged Studio
directories:
  buildResources: electron/icons
  output: release
# Everything the app needs at runtime is in dist/ (Vite bundles the dependencies) and electron/.
files:
  - dist/**
  - electron/**
  - package.json
  - '!node_modules/**'
artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false
win:
  # Per architecture (x64 and arm64): a portable exe, and a zip of the unpacked app folder for
  # environments where downloaded executables are blocked (unzip, then run the exe inside).
  target:
    - target: portable
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: electron/icons/icon.png
portable:
  # One exe per architecture only; skip the combined x64+arm64 exe (twice the size, nothing more).
  buildUniversalInstaller: false
linux:
  target: AppImage
  category: Office
  icon: electron/icons/icon.png
mac:
  # Apple Silicon and Intel: markdown-paged-studio-<version>-mac-arm64.* and -mac-x64.*
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  icon: electron/icons/icon.png
