name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: Document that shows it
      description: The smallest Markdown (and custom CSS, if it matters) that reproduces the problem.
      render: markdown
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the sidebar, with the commit.
      placeholder: v1.11.0 · 5d54429
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      multiple: true
      options:
        - Web app (GitHub Pages)
        - Own build or dev server
        - Desktop app, Windows
        - Desktop app, Linux
        - Desktop app, macOS
        - Docker image
        - MCP server
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 140 on Windows 11
  - type: dropdown
    id: output
    attributes:
      label: What is affected
      multiple: true
      options:
        - Preview
        - HTML export
        - PDF export or print
        - Settings, import or autosave
        - Something else
