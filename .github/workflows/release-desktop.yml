name: Desktop release

# Builds the portable desktop binaries for Windows, Linux and macOS.
# - Manually from the Actions tab ("Run workflow"): the binaries are attached to the run as artifacts;
#   tick "publish" to also create or update the GitHub Release tagged v<version from package.json>.
# - Automatically on a tag push starting with "v": binaries are attached to that tag's release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish a GitHub Release tagged v<package.json version> with the binaries'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  # No binary is built or published from a commit that fails the checks of ci.yml. A tag is usually pushed
  # with its commit, whose push to main already runs CI: that run is awaited and reused. The checks only run
  # here when the commit has no CI run (a tag on an older commit, a manual run on another branch).
  gate:
    name: Look for the CI run of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run_checks: ${{ steps.ci.outputs.run_checks }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Latest CI run of the commit as "status conclusion", empty when there is none.
          latest() {
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.status) \(.conclusion)"'
          }
          for attempt in $(seq 1 50); do
            state=$(latest || true)
            case "$state" in
              "completed success")
                echo "CI passed on $SHA: its result is reused."
                echo "run_checks=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed*)
                echo "::error::CI did not pass on $SHA ($state): nothing is released."
                exit 1
                ;;
              "")
                # The run of a commit pushed together with its tag can take a moment to appear.
                if [ "$attempt" -ge 4 ]; then
                  echo "No CI run for $SHA: the checks run here."
                  echo "run_checks=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              *) echo "CI is $state on $SHA, waiting." ;;
            esac
            sleep 30
          done
          echo "CI did not finish in time: the checks run here."
          echo "run_checks=true" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: gate
    if: needs.gate.outputs.run_checks == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.os }}
    needs: [gate, checks]
    # `checks` is skipped when the CI run of the commit was reused.
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache the Electron downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Read the package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the desktop app
        run: npm run desktop:build
        env:
          # Unsigned builds: electron-builder must not try to sign or notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd release
          # nullglob: each OS only produces some of these extensions, and bash runs with -e here.
          shopt -s nullglob
          files=(*.exe *.AppImage *.dmg *.zip)
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.label }}.txt"; else shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ matrix.label }}.txt"; fi
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Upload the binaries as run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markdown-paged-studio-${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Take the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        run: node scripts/release-notes.mjs "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}" > release-notes.md

      - name: Attach the binaries to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Markdown Paged Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          # The section of CHANGELOG.md for this version, followed by the list of commits GitHub generates.
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-*.txt
