name: Deploy to GitHub Pages

# Publishes the web app at https://florianlotte.github.io/markdown-paged-studio/ once the CI workflow has
# passed on main, so a commit that fails the tests is never deployed. "Run workflow" deploys main by hand.
# One-time setup: in the repository Settings > Pages, set Source to "GitHub Actions". The workflow token
# cannot create the Pages site itself ("Resource not accessible by integration").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # CI also runs for pull requests and is called by the release: only its pushes to main deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that was tested, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build for the repository sub-path
        run: npx vite build --base=/markdown-paged-studio/

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
