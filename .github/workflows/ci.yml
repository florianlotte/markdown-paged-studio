name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the desktop release, which builds nothing until these checks pass.
  workflow_call:

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache the Playwright and Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/electron
          key: browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - run: npm test
        env:
          CI: 'true'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      - run: npm run build

      - name: Package the desktop app (unpacked) and smoke-test it
        run: |
          npx electron-builder --dir --publish never
          xvfb-run -a npm run test:desktop

      - name: Test the MCP server end to end
        run: npm run test:mcp

  # The web suite again under the two other engines. Chromium, in `check`, stays the reference.
  browsers:
    name: Web tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      # This job never starts the desktop app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache the Playwright download
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: browser-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm run test:${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg APP_COMMIT=${{ github.sha }} -t markdown-paged-studio .

      - name: Smoke test the container
        run: |
          docker run -d --name studio -p 8080:80 markdown-paged-studio
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker rm -f studio
