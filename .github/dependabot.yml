version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Mermaid brings its own KaTeX (^0.18): the same range keeps one copy of it in the build.
      - dependency-name: katex
        versions: ['>=0.19.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
